t.jsx-695476342{padding:undefined 0}</style><style id="__jsx-3013368158">.preview-controls-container.jsx-3013368158{position:fixed;z-index:98;bottom:calc(0rem + 2.5rem);right:4.5rem}html[dir='rtl'] .preview-controls-container.jsx-3013368158{right:unset;left:4.5rem}</style></head><body><div id="__next"><div class="website-design-provider WebsiteDesignProvider_website-design-provider__QYb5B WebsiteDesignProvider_light-theme__8gt8e"><div id="storymaps-root" class="page-container jsx-695476342"><main class="jsx-23704138 jsx-3583557569 viewer-main story-container"><div class="website-design-provider WebsiteDesignProvider_website-design-provider__QYb5B WebsiteDesignProvider_light-theme__8gt8e"></div><div class="website-design-provider WebsiteDesignProvider_website-design-provider__QYb5B WebsiteDesignProvider_light-theme__8gt8e"></div></main></div><div class="website-design-provider WebsiteDesignProvider_website-design-provider__QYb5B WebsiteDesignProvider_dark-theme__JC4N0"></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{},"id":"191c16f2b2e44f59ba487a08143a778f","itemDetails":{"id":"191c16f2b2e44f59ba487a08143a778f","ownerId":"70915cdc296a4a06931d3bd125503e1a","orgId":"SR1muQK0r6SVF2nb","created":1792691296000,"isOrgItem":true,"modified":1793770974000,"guid":null,"name":null,"title":"Streets, Spaces \u0026 Shared Tables ","type":"StoryMap","typeKeywords":["arcgis-storymaps","smdraftresourceid:draft_1793770973236.json","smfirstpublisheddate:1792956439922","smguidedtour","smpublisheddate:1793770973233","smstatuspublished","smversiondraft:26.44.1397","smversionpublished:26.44.1397","StoryMap","Web Application","Viewer Copyable"],"description":"\u003cp\u003eJackson Heights, located in the Northwest section of Queens, is a culturally diverse neighborhood in New York City and perhaps in the world. As the New York Times stated, \u0026quot;Jackson Heights is the most culturally diverse neighborhood in New York City and possibly in the entire world\u0026quot;. Jackson Heights is home to approximately 108,000 to 175,000 residents, of which 60% to 64% were born outside the United States.\u003c/p\u003e\u003cp\u003eTherefore, Jackson Heights is a true melting pot that speaks more than 167 languages. The majority of the population in Jackson Heights is Hispanic, however, there are also many South Asians, Latin Americans and Himalayan people living there.\u003c/p\u003e\u003cp\u003eYet this vibrant community faces a critical challenge: a severe lack of public open space. Jackson Heights has as little as 2 square feet of park space per resident, ranking last in all New York City neighborhoods. The entire area has fewer than 12 acres of public parks. The lack of public open spaces in Jackson Heights was particularly harmful to the community during the COVID-19 pandemic.\u003c/p\u003e","tags":[""],"snippet":"Urban Systems and Everyday Life in Queens Community District 3","thumbnail":"thumbnail/thumbnail.jpeg","documentation":null,"extent":[],"categories":[],"spatialReference":null,"accessInformation":null,"classification":null,"licenseInfo":null,"culture":"zh-cn","properties":{"thumbnail":["url","https://su.example/content/items/191c16f2b2e44f59ba487a08143a778f/resources/a5f41f2b-f59f-476d-a622-2f803326b97e.jpeg{{qp|[[\"wago\"],[\"ust\"]]}}"],"shouldHideCover":false,"scriptEmbedDomains":["yl4389"],"isScriptEmbedEnabled":true},"advancedSettings":null,"url":"https://storymaps.arcgis.com/stories/191c16f2b2e44f59ba487a08143a778f","proxyFilter":null,"access":"org","size":38057002,"subInfo":0,"appCategories":[],"industries":[],"languages":[],"largeThumbnail":null,"banner":null,"screenshots":[],"listed":false,"ownerFolder":null,"protected":false,"commentsEnabled":true,"numComments":0,"numRatings":0,"avgRating":0,"numViews":44,"itemControl":"admin","scoreCompleteness":66,"groupDesignations":null,"apiToken1ExpirationDate":-1,"apiToken2ExpirationDate":-1,"contentOrigin":"self","lastViewed":1793811600000,"o":"ismb130npbO}h;\u003eugrN:JnnxNMU9OW9E[WiLVyL\u003e"},"publishedData":{"root":"n-7Qjj5e","nodes":{"n-xUeYva":{"type":"image","data":{"image":"r-aNCtuY"}},"n-7mE6PZ":{"type":"storycover","data":{"type":"minimal","title":"Streets, Spaces \u0026 Shared Tables ","summary":"Urban Systems and Everyday Life in Queens Community District 3","byline":"Fanning Yifan Luo  Hazel Hanyu Xue","titlePanelVerticalPosition":"top","titlePanelHorizontalPosition":"start","titlePanelStyle":"gradient"},"config":{"isHidden":false},"children":["n-xUeYva"]},"n-speiLj":{"type":"navigation","data":{"links":[{"nodeId":"n-DbdsXO"},{"nodeId":"n-896q4E"},{"nodeId":"n-l4eSmq"},{"nodeId":"n-pEwaKl"},{"nodeId":"n-i1gH9G"},{"nodeId":"n-wk7LPa"}]},"config":{"isHidden":false}},"n-DbdsXO":{"type":"text","data":{"type":"h2","text":"Intro"}},"n-CYhTLf":{"type":"text","data":{"text":"Jackson Heights, located in the Northwest section of Queens, is a culturally diverse neighborhood in New York City and perhaps in the world. As the New York Times stated, \u0026quot;Jackson Heights is the most culturally diverse neighborhood in New York City and possibly in the entire world\u0026quot;. Jackson Heights is home to approximately 108,000 to 175,000 residents, of which 60% to 64% were born outside the United States.","type":"paragraph"}},"n-b1N9T5":{"type":"text","data":{"type":"paragraph","text":"Therefore, Jackson Heights is a true melting pot that speaks more than 167 languages. The majority of the population in Jackson Heights is Hispanic, however, there are also many South Asians, Latin Americans and Himalayan people living there."}},"n-TLJlM0":{"type":"image","data":{"image":"r-yxYQws","caption":"The Jackson Heights–Roosevelt Avenue/74th Street subway station, gateway to the neighborhood. Photo: Pacific Coast Highway, public domain, via Wikimedia Commons."},"config":{"size":"full"}},"n-VwIX0Q":{"type":"text","data":{"type":"paragraph","text":"Yet this vibrant community faces a critical challenge: a severe lack of public open space. Jackson Heights has as little as 2 square feet of park space per resident, ranking last in all New York City neighborhoods. The entire area has fewer than 12 acres of public parks. The lack of public open spaces in Jackson Heights was particularly harmful to the community during the COVID-19 pandemic."}},"n-3FmSC3":{"type":"text","data":{"type":"paragraph","text":"In response, the community created an innovative solution. During the COVID-19 lockdowns of 2020, 34th Avenue was transformed into an Open Street for pedestrians and cyclists. This 1.3 mile stretch spanning 26 blocks, now known as Paseo Park, has been widely recognized as the “gold standard” for New York City’s car‑free open streets. The city has allocated $89 million to make it a permanent linear park. As one community member put it: “There’s nowhere for your children to learn to ride bikes … they don’t have room for recess.” Paseo Park is changing that."}},"n-i0u96G":{"type":"text","data":{"type":"paragraph","text":"Sources: [1][2][3]","textSize":"small"}},"n-LOA84D":{"type":"image","data":{"image":"r-stK7mo","caption":"Paseo Park (a permanent linear park)"},"config":{"size":"float","floatAlignment":"end"}},"n-VX0oZ1":{"type":"text","data":{"type":"paragraph","text":"Jackson Heights is an example of a place with an inclusive street life, as evidenced by events such as the Queens Pride Parade, Momo Crawl and Festival Calle Colombia; these events help ensure that public spaces in Jackson Heights are always active and open to everyone."}},"n-zFgZjX":{"type":"video","data":{"video":"r-WRGmYj","thumbnail":"r-46Iv3P","caption":"Site Visit Video"},"config":{"size":"standard"}},"n-mwzpAp":{"type":"text","data":{"text":"Hard System Overview: Reading Jackson Heights Layer by Layer","type":"h3"},"config":{"size":"wide"}},"n-UHvJq6":{"type":"text","data":{"type":"paragraph","text":"This is every hard system layer mapped for Jackson Heights at once: streets, buildings, parks, land use, and transit. Scroll down to see how the neighborhood was built."},"config":{"size":"wide"}},"n-ce7NZq":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-mwzpAp","n-UHvJq6"]},"n-8kZkaT":{"type":"webmap","data":{"caption":"JH Map0 - Hard System Layers","map":"r-81186482d5dd48ca9882593adadd6bfe","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227938.748705825,"ymin":4975001.275223803,"xmax":-8222654.785350477,"ymax":4977972.764698468},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225296.767028151,"y":4976487.019961135},"zoom":15.347941567064591,"viewpoint":{"rotation":0,"scale":14914.746214192925,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225296.767028151,"y":4976487.019961135}}}},"n-kpwCqK":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-ce7NZq","n-8kZkaT"]},"n-w86IgG":{"type":"text","data":{"text":"The Street Grid","type":"h3"},"config":{"size":"wide"}},"n-D0ORwk":{"type":"text","data":{"type":"paragraph","text":"The Queensboro Corporation created a rigid orthogonal grid in 1909 (long blocks ran north-south to maximize sunlight) and mapped out 1,001 street segments ranging from 6 to 70 feet wide, with an average width of 32.6 feet. Traffic is carried on wide arterials, while narrow side streets were constructed for quietness."},"config":{"size":"wide"}},"n-GVAd9E":{"type":"image","data":{"image":"r-RXgbi4","caption":"Early 19th-century photo, courtesy of Jeffrey A. (The Jackson Heights Garden City Society, Inc.)."},"config":{"size":"wide"}},"n-3Rhxn9":{"type":"image","data":{"image":"r-07eziA","caption":"Early 19th-century photo, courtesy of Jeffrey A. (The Jackson Heights Garden City Society, Inc.)."},"config":{"size":"wide"}},"n-VJe5rD":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-w86IgG","n-D0ORwk","n-GVAd9E","n-3Rhxn9"]},"n-sBRurG":{"type":"webmap","data":{"caption":"JH Map0 - Hard System Layers","map":"r-81186482d5dd48ca9882593adadd6bfe","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"1a0b2caa825-layer-8","title":"green_infrastructure_","visible":false},{"id":"1a0b2ca5ee9-layer-7","title":"railways_","visible":false},{"id":"1a0b2ca1824-layer-6","title":"subway_stations_","visible":false},{"id":"1a0b2c9c78a-layer-5","title":"landuse","visible":false},{"id":"1a0b2c95e8f-layer-4","title":"parks_","visible":false},{"id":"1a0b2c9088f-layer-3","title":"buildings_gov","visible":false},{"id":"1a0b2c8bd6e-layer-2","title":"streets_centerline","visible":true}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227070.005302338,"ymin":4975143.764230826,"xmax":-8222531.556747787,"ymax":4977696.641542762},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224800.781025062,"y":4976420.202886794},"zoom":16.037190082640798,"viewpoint":{"rotation":0,"scale":8860.101797984224,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"  corridor farther from the subway; the Soft Systems section tests this relationship using modelled five- and ten-minute walks."},"config":{"size":"wide"}},"n-CY7dbg":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-8RoKss","n-BZ40I7","n-mcN5tI"]},"n-3SkoVs":{"type":"webmap","data":{"caption":"JH Map0 - Hard System Layers","map":"r-81186482d5dd48ca9882593adadd6bfe","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"1a0b2caa825-layer-8","title":"green_infrastructure_","visible":false},{"id":"1a0b2ca5ee9-layer-7","title":"railways_","visible":true},{"id":"1a0b2ca1824-layer-6","title":"subway_stations_","visible":true},{"id":"1a0b2c9c78a-layer-5","title":"landuse","visible":false},{"id":"1a0b2c95e8f-layer-4","title":"parks_","visible":false},{"id":"1a0b2c9088f-layer-3","title":"buildings_gov","visible":false},{"id":"1a0b2c8bd6e-layer-2","title":"streets_centerline","visible":false}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227318.550554909,"ymin":4974645.899292307,"xmax":-8222692.958839497,"ymax":4977247.146911206},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225005.754697203,"y":4975946.523101756},"zoom":15.553784860557592,"viewpoint":{"rotation":0,"scale":13056.397610332271,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225005.754697203,"y":4975946.523101756}}}},"n-SPB2fu":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-CY7dbg","n-3SkoVs"]},"n-pUNtcl":{"type":"text","data":{"text":"Land Use","type":"h3"},"config":{"size":"wide"}},"n-y5Gv9j":{"type":"text","data":{"type":"paragraph","text":"In terms of color coding, purple represents retail; blue represents residential; and green represents park or forest. "},"config":{"size":"wide"}},"n-hZQilh":{"type":"text","data":{"type":"paragraph","text":"As expected by the prediction made from the transit layer (red dots), the majority of the neighborhood was residential. Retail areas were located on both sides of the avenues adjacent to the subway stations."},"config":{"size":"wide"}},"n-t2zsGv":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-pUNtcl","n-y5Gv9j","n-hZQilh"]},"n-kU0Xvs":{"type":"webmap","data":{"caption":"JH Map0 - Hard System Layers","map":"r-81186482d5dd48ca9882593adadd6bfe","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"1a0b2caa825-layer-8","title":"green_infrastructure_","visible":false},{"id":"1a0b2ca5ee9-layer-7","title":"railways_","visible":false},{"id":"1a0b2ca1824-layer-6","title":"subway_stations_","visible":true},{"id":"1a0b2c9c78a-layer-5","title":"landuse","visible":true},{"id":"1a0b2c95e8f-layer-4","title":"parks_","visible":false},{"id":"1a0b2c9088f-layer-3","title":"buildings_gov","visible":true},{"id":"1a0b2c8bd6e-layer-2","title":"streets_centerline","visible":false}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8228339.039012454,"ymin":4974563.107738085,"xmax":-8221363.954849472,"ymax":4978486.025684105},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224851.496930963,"y":4976524.566711095},"zoom":15.101374537597124,"viewpoint":{"rotation":0,"scale":17140.747786522592,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224851.496930963,"y":4976524.566711095}}}},"n-6Vgze1":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-t2zsGv","n-kU0Xvs"]},"n-nbw7Wp":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-kpwCqK","n-AkzgEb","n-t7rhJs","n-lgwwL4","n-SPB2fu","n-6Vgze1"]},"n-896q4E":{"type":"text","data":{"type":"h2","text":"Phase 1"}},"n-pp16Gp":{"type":"text","data":{"type":"h3","text":"System Origins: Street Grid + Whole-Block Landscape Design (1909–1930s)"}},"n-F4sYRa":{"type":"text","data":{"type":"paragraph","text":"The Queensboro Corporation adapted the Garden City ideal — originally designed for curving suburban lanes — onto the city\u0026apos;s rigid orthogonal grid. Each block was treated as a single landscape unit: a continuous grass strip ran between curb and sidewalk, buildings were set back to create front yards, and the center of every block held a large interior garden. Only about 30–50% of each block was covered by buildings, versus roughly 90% coverage on comparable Manhattan blocks of the same era. "}},"n-HHaA7A":{"type":"text","data":{"type":"paragraph","text":"The hard-system variables that define this phase: grid orientation (long blocks run north–south to maximize sunlight), building coverage ratio, courtyard area, and building setback. Notably, Garden City on Long Island used curving roads for the same ideal — Jackson Heights\u0026apos; choice to keep the orthogonal grid was itself a defining hard-system decision."}},"n-3pz6eQ":{"type":"image","data":{"image":"r-UmTSrb","caption":"A typical residential street in Jackson Heights, showing the front-yard setbacks and street trees of the original plan. Photo: Jleon, CC BY 2.5, via Wikimedia Commons."},"config":{"size":"float","floatAlignment":"start"}},"n-ndaCR4":{"type":"text","data":{"type":"paragraph","text":"Sources: [4][5][6]","textSize":"small"}},"n-EC0Hz8":{"type":"webmap","data":{"caption":"Map 1 — Street \u0026amp; open-space cross-section: building footprints (brown), interior block gardens (green), and the street grid. Note how coverage varies block by block.","map":"r-865dbb45a3b3455590652560174b9ed9","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8228394.100188324,"ymin":4974545.65525695,"xmax":-8220934.323958922,"ymax":4978742.525841343},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224664.212073623,"y":4976644.090549147},"zoom":16,"viewpoint":{"rotation":0,"scale":9027.977411,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224664.212073623,"y":4976644.090549147}}}},"n-lCZjYn":{"type":"text","data":{"text":"Zooming In: One Block Cluster","type":"h4"},"config":{"size":"wide"}},"n-yKUzzf":{"type":"text","data":{"type":"paragraph","text":"The full-neighborhood maps above compress a lot of information. Here we zoom into ","n-J9jF9d"]},"n-KJbjZJ":{"type":"text","data":{"type":"paragraph","text":"Data: [7][8]","textSize":"small"}},"n-u5yMff":{"type":"text","data":{"type":"h3","text":"Measuring the Street: Width and the Public Right-of-Way"}},"n-oNwOsO":{"type":"text","data":{"type":"paragraph","text":"The NYC LION street-centerline dataset records an official mapped width for every block face, letting the \u0026quot;continuous grass strip\u0026quot; of the original plan be measured rather than just described. Across Jackson Heights\u0026apos; 1,001 mapped street segments, widths range from 6 to 70 feet, averaging 32.6 feet — with the widest belonging to arterial avenues like Northern Boulevard and 34th Avenue, and the narrowest to the quiet residential side streets the Garden City plan was built around. This variation in the public right-of-way is itself a hard-system fingerprint of the 1909 plan: wide enough for a planted median on the boulevards, narrow enough on side streets to keep traffic subordinate to the block\u0026apos;s interior garden."}},"n-LQ1vnA":{"type":"webmap","data":{"caption":"Map 4 — Street width by segment (NYC LION): darker blue = wider right-of-way. Arterial avenues stand out from the narrower residential grid, a direct trace of the 1909 cross-section design.","map":"r-f136d16812fc4e66b023789a37ce1c72","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227980.400540977,"ymin":4974757.967082027,"xmax":-8221777.697348001,"ymax":4978246.119064335},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x" ,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225300.187215822,"y":4976138.026188005},"zoom":17.817525496260878,"viewpoint":{"rotation":0,"scale":2668.838277323199,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225300.187215822,"y":4976138.026188005}}}},"n-Ip7wLo":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-Q2tkd1","n-iwROWA"]},"n-we6YuT":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-AciF03","n-NWYIcC","n-Ip7wLo"]},"n-uJVQA4":{"type":"text","data":{"type":"paragraph","text":"Data: [7][8]","textSize":"small"}},"n-pEwaKl":{"type":"text","data":{"type":"h2","text":"Phase 3"}},"n-Ewd6da":{"type":"text","data":{"type":"h3","text":"System Stress and Rebalancing (2000–Present)"}},"n-sA91fm":{"type":"text","data":{"type":"paragraph","text":"By the 2000s, population growth and the formation of a dense immigrant community, in which \u003cstrong\u003emore than 60% of residents were foreign-born\u003c/strong\u003e, came into direct conflict with the shortage of public open space produced by Phase 2. Jackson Heights\u0026apos; open space ratio (OSR) is 0.91, compared with a Queens-wide average of 3.37. \u003cstrong\u003eThe 34th Avenue Open Street, now called Paseo Park, is a direct outcome of that tension.\u003c/strong\u003e \u003cstrong\u003eDuring the pandemic, 1.3 miles and 26 blocks of roadway were converted into a linear park\u003c/strong\u003e, when the neighborhood was described as \u0026quot;the epicenter of the epicenter.\u0026quot; Only seven blocks are fully pedestrianized, however; the remainder operate as shared streets where vehicles are permitted at 5 mph. The roughly 7-acre footprint therefore measures roadway reallocated, not open space acquired\u003cstrong\u003e.\u003c/strong\u003e The contemporary hard-system variables are OSR, the footprint of Paseo Park (about 7 acres), and schoolyard-to-park conversions such as PS 69."}},"n-rvW7E2":{"type":"text","data":{"type":"paragraph","text":"Sources: [10][2][3]","textSize":"small"}},"n-zDNlN0":{"type":"image","data":{"image":"r-G3HjPr","caption":"Paseo Park from Google Maps"}},"n-Ask8YR":{"type":"text","data":{"type":"paragraph","text":"In Jackson Heights, approximately 25 acres of mapped park and open-space parcels consist of 14.33 acres across 15 named, confirmed-public parks and playgrounds, as well as an additional 10.35 acres of interior-block parcels which are probably private cooperative courtyards (refer to Map 2). Compared to the neighborhood\u0026apos;s 2020 census population of 101,848 (according to NYC Planning Population FactFinder), the confirmed-public park total equals approximately 6.1 square feet of park space per resident, and an open-space ratio close to 1.4 acres of park space per 10,000 residents — a parcel-based estimation that matches the borough-wide park deficit reported by NYC Planning and Trust for Public Land above."}},"n-1icgoA":{"type":"webmap","data":{"caption":"Map 3 — Paseo Park (magenta line, 34th Avenue) runs through the heart of the neighborhood, flanked by public schools (blue triangles) and connected to the subway network (dark squares) — illustrating why this corridor became the pressure valve for the open-space shortfall.","map":"r-2f7766414c8145c48672359635f954bb","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"1a0b30bb58b-layer-6","title":"Sketch","visible":false},{"id":"1a0988cf685-layer-5","title":"buildings_gov","visible":true},{"id":"1a0988c9307-layer-4","title":"subway_stations_","visible":true},{"id":"1a0988c1e22-layer-3","title":"public_schools","visible":true},{"id":"1a0988babc config":{"size":"wide"}},"n-RLvKuE":{"type":"text","data":{"type":"paragraph","text":"Paseo Park lies north of Roosevelt Avenue, creating opportunities to connect subway arrivals with a residential open-space corridor. Walking distance varies by block and entrance; the Soft Systems map measures these connections rather than assuming a uniform five-minute walk."},"config":{"size":"wide"}},"n-szq6dq":{"type":"image","data":{"caption":"Paseo Park from Google Maps","image":"r-RVbwpY"},"config":{"size":"wide"}},"n-86RdpU":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-l6VwRW","n-RLvKuE","n-szq6dq"]},"n-vGfaIF":{"type":"webmap","data":{"caption":"JH Map3 - Paseo Park System Analysis","map":"r-2f7766414c8145c48672359635f954bb","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"1a0988c1e22-layer-3","title":"public_schools","visible":true},{"id":"1a0b30bb58b-layer-6","title":"Sketch","visible":false},{"id":"1a0988cf685-layer-5","title":"buildings_gov","visible":true},{"id":"1a0988c9307-layer-4","title":"subway_stations_","visible":true},{"id":"1a0988babcb-layer-2","title":"paseo_park_corridor","visible":true}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227537.644887533,"ymin":4974540.0716347955,"xmax":-8223934.035451807,"ymax":4976566.597329419},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225735.84016967,"y":4975553.334482107},"zoom":15.873312898495007,"viewpoint":{"rotation":0,"scale":10171.70570165214,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8225735.84016967,"y":4975553.334482107}}}},"n-lrM5Sn":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-86RdpU","n-vGfaIF"]},"n-tkLDqo":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-pO4WJV","n-2c48fq","n-lrM5Sn"]},"n-sUyYKY":{"type":"text","data":{"type":"paragraph","text":"Data: [7][11][12]","textSize":"small"}},"n-MPjl6N":{"type":"text","data":{"type":"h3","text":"Contemporary Street Transformation: Bike Infrastructure and Green Stormwater Systems"}},"n-nE8lG4":{"type":"image","data":{"image":"r-G70qHS","caption":"The \u0026quot;Paseo Park\u0026quot; street sign at 79th Street, marking the former traffic lane now reserved for pedestrians and cyclists. Photo: Kidfly182, CC BY 4.0, via Wikimedia Commons.","isInFullView":true,"isExpandable":true},"config":{"size":"float","floatAlignment":"start"}},"n-su5a6V":{"type":"text","data":{"type":"paragraph","text":"The right-of-way was fixed in 1909. Everything since has been layered onto it rather than added to it. "}},"n-U6UY2L":{"type":"text","data":{"type":"h4","text":"Two Retrofits, One Grid"}},"n-iErLYp":{"type":"text","data":{"type":"paragraph","text":"Two contemporary layers sit on top of the 1909 street grid: a bike network classified by protection level, and hundreds of green-infrastructure assets (bioswales, tree pits, stormwater greening) installed along the curb. The next two slides isolate each one."}},"n-rEO90g":{"type":"text","data":{"type":"h4","text":"Layer 1: The Bike Network"}},"n-X8ssvG":{"type":"text","data":{"type":"paragraph","text":"Nearly the entire bicycle network in Jackson Heights is \u003cstrong\u003eClass II\u003c/strong\u003e — a painted stripe within the roadway, \u003cstrong\u003eoffering no physical barrier between cyclists and moving traffic (red)\u003c/strong\u003e. A single short \u003cstrong\u003eClass I\u003c/strong\u003e segment, \u003cstrong\u003ephysically separated from traffic\u003c/strong\u003e, appears in the entire study area (purple). The remainder consists of scattered\u003cstrong\u003e Class III\u003c/strong\u003e treatments — \u003cstrong\u003eshared lanes marked only with sharrows and signage,\u003c/strong\u003e where cyclists ride in the traffic lane itself (green) — and one corridor combining Class II and III (blue). Most of the grid carries no bicycle facility at all."}},"n-FVYgfj":{"type":"image","data":{"image":"r-fQtyRS","caption":"A protected, planter-buffered bike lane in New York City — the same design standard NYC DOT applies to Class I segments citywide. Photo: Jim.henderson, CC BY-SA 4.0, via Wikimedia Commons."},"config":{"size":"float","floatAlignment":"start"}},"n-RMSM0X":{"type":"text","data":{"text":"Layer 2: Green Infrastructure","type":"h4"}},"n-W1I3ob":{"type":"text","data":{"type":"paragraph","text":"\u003cstrong\u003eHundreds of green-infrastructure assets\u003c/strong\u003e — bioswales and stormwater greenstreets installed along the curb by NYC DEP — appear across the neighborhood. Unlike the bike network, they do not concentrate on a few arterials. They \u003cstrong\u003espread block by block across the entire grid\u003c/strong\u003e, reaching the narrow Phase 1 side streets that carry no bicycle facility at all."}},"n-HNdGmf":{"type":"webmap","data":{"caption":"Map 5. Bicycle network and green infrastructure, Jackson Heights.\nPurple — Class I (separated); red — Class II (painted); green — Class III (sharrow); blue — II/III combined; grey — none. Orange points — green-infrastructure assets. Source: NYC LION, \u003ccode\u003ebike_lane\u003c/code\u003e codes 1/2/3/6.","map":"r-2f760dedec944d8388474e2634ded0ae","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8227151.905001902,"ymin":4975290.580833776,"xmax":-8222613.456447351,"ymax":4977842.822627336},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224882.680724626,"y":4976566.701730556},"zoom":15.581030619865782,"viewpoint":{"rotation":0,"scale":12810.423510752396,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8224882.680724626,"y":4976566.701730556}}}},"n-usYOxc":{"type":"text","data":{"type":"paragraph","text":"Data: [13][14]","textSize":"small"}},"n-i1gH9G":{"type":"text","data":{"type":"h2","text":"Soft Systems · A World at the Table"}},"n-qODR0a":{"type":"text","data":{"text":"A district of food connections.","type":"h3"},"config":{"size":"wide"}},"n-iSbyMF":{"type":"text","data":{"text":"When we mentioned Queens Community District 3 to friends, food almost always came up. We follow food across the whole district: where restaurants gather, how people reach them, and how commercial streets connect everyday life.","type":"paragraph"},"config":{"size":"wide"}},"n-9a9V3U":{"type":"text","data":{"text":"Photo: 74th Street during Eid, March 2025. CC0, via Wikimedia Commons.","type":"paragraph"},"config":{"size":"wide"}},"n-1U0wbw":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-qODR0a","n-iSbyMF","n-9a9V3U"]},"n-j4klaG":{"type":"image","data":{"image":"r-kklgyC"}},"n-jCegdr":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-1U0wbw","n-j4klaG"]},"n-Yv7Ymo":{"type":"immersive","data":{"type":"sidecar","subtype":"floating-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-jCegdr"]},"n-bIAEut":{"type":"webmap","data":{"map":"r-21122de4a18f42ad8ce9ca644a5650ca","caption":"CD 403 · Study area. Sources: [3] NTA boundaries, [4] community district boundary, [5] MTA subway entrances.","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":-8230149.414577773,"ymin":4973862.994055552,"xmax":-8220091.956888916,"ymax":4979518.756802134},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":-8225120.685733344,"y":4976690.875428843},"zoom":14.261557785164426,"viewpoint":{"rotation":0,"scale":31389.234090990292,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":-8225120.685733344,"y":4976690.875428843}}}},"n-ew9ezK":{"type":"text","data":{"type":"paragraph","text":"Queens Community District 3 (BoroCD 403) encompasses Jackson Heights, East Elmhurst and North Corona. Across its residential blocks and commercial streets, restaurants, shops and shared spaces connect food, culture and everyday life. The district offers a setting for exploring how diverse food traditions shape local businesses and how these businesses relate to the surrounding urban environment.\n\nIn the 2020 Census, Community District 3 had 179,134 residents: 63.3% Hispanic or Latino of any race, 19.2% Asian non-Hispanic, 9.8% White non-Hispanic and 4.9% Black non-Hispanic. Other-race and multiracial non-Hispanic residents accounted for 1.2% and 1.5%. \n\nHere, soft systems refers to the cultural practices, businesses and everyday exchanges that give streets meaning. Restaurant locations, population, commercial properties and shared spaces describe the spatial setting for those relationships."}},"n-Fi04eM":{"type":"image","data":{"caption":"Produced with AI-assisted Python analysis and plotting.","image":"r-DAp7gl"},"config":{"size":"wide"}},"n-HVWPrC":{"type":"text","data":{"type":"h3","text":"01 · Where Is the Table Set?"}},"n-uFB6up":{"type":"text","data":{"type":"paragraph","text":"Across Community District 3, 502 restaurant establishments connect Jackson Heights, East Elmhurst and North Corona. The shared restaurant dataset contains 39 recorded cuisine categories: 470 establishments have a cuisine label and 32 are unclassified. By neighborhood, 333 records fall in Jackson Heights, 115 in North Corona and 54 in East Elmhurst.\n\n37th Avenue and Northern Boulevard each contain 112 records; Roosevelt Avenue contains 80. Together these three address corridors account for 304 establishments, or 60.6% of the district total. Junction Boulevard adds 32 and Astoria Boulevard 19, showing why the district’s food geography extends beyond the Jackson Heights core.\n\nThe map groups administrative cuisine labels into six display categories. These describe recorded food offerings, rather than residents’ ethnicity. Neighborhood boundaries provide geographic context; the brown contours show estimated restaurant concentration. "}},"n-LtRDPY":{"type":"webmap","data":{"map":"r-cc07c16716694c44ba456fafebb50883","caption":"CD 403 · Restaurant Distribution \u0026amp; Cuisine. Sources: [1] DOHMH restaurant records (502 establishments), [2] Census 2020 tables, [3] NTA boundaries, [4] community district boundary.","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent"}},"n-v7XdWh":{"type":"text","data":{"type":"paragraph","text":"Restaurant concentration across CD 403\n\nThe heat map makes the concentration of restaurants along three major corridors—37th Avenue, Roosevelt Avenue and Northern Boulevard—more visible. These corridors form a strong cluster in and around Jackson Heights, while restaurant locations are more dispersed across East Elmhurst and extend eastward into North Corona. The pattern highlights the role of commercial streets in organizing the district’s food geography."}},"n-WGN5FN":{"type":"webmap","data":{"caption":"CD 403 · Relative restaurant concentration. Sources: [1] DOHMH restaurant records (502 establishments), [2] Census 2020 tables, [3] NTA boundaries.","map":"r-4f2602d597004ff9a904d07504cefeb9","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"xmin":-8229965.866875561,"ymin":4973428.24319121,"xmax":-8217681.6030308325,"ymax":4980336.239622473},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8223823.734953197,"y":4976882.241406841},"zoom":12.938325991189478,"viewpoint":{"rotation":0,"scale":38339.07587648715,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100,"falseM":-100000,"falseX":-20037700,"falseY":-30241100,"falseZ":-100000,"mTolerance":0.001,"mUnits":10000,"xyTolerance":0.001,"xyUnits":10000,"zTolerance":0.001,"zUnits":10000},"x":-8223823.734953197,"y":4976882.241406841}}}},"n-oug4Ag":{"type":"image","data":{"image":"r-m6gosq","caption":" Restaurants beside a subway entrance, Jackson Heights. Photo: \u003ca href=\"https://commons.wikimedia.org/wiki/File:Jackson_Heights,_Queens_NY.jpg\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eTenzin Youdon, 2018\u003c/a\u003e, \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eCC BY-SA 4.0\u003c/a\u003e."},"config":{"size":"standard"}},"n-gIP6va":{"type":"text","data":{"type":"h3","text":"Why Here? Commercial Corridors Across the District"}},"n-rolp43":{"type":"text","data":{"type":"paragraph","text":"The three main avenues contain 60.6% of CD 403’s restaurant establishments. Why do restaurants cluster along these three avenues? Is the pattern shaped by land-use planning, nearby customers, or businesses gathering around one another? To explore these possibilities, we compare restaurant locations with recorded retail use, housing and schools across CD 403."}},"n-l4Wdxn":{"type":"text","data":{"type":"h4","text":"A planned commercial framework, an evolving food culture"}},"n-YCVc2r":{"type":"text","data":{"type":"paragraph","text":"The 1993 Jackson Heights Historic District report identifies 37th Avenue as the commercial spine and describes commercial streets designed to complement residential development. It supports an intentional neighborhood-commercial structure, rather than a plan prescribing today’s cuisines. At the eastern edge, the 2003 North Corona rezoning matched commercial overlays to existing retail patterns while limiting their depth to protect residential side streets. That rezoning covered the eastern edge and adjacent area, not all of Jackson Heights. Sources: NYC LPC (1993), https://s-media.nyc.gov/agencies/lpc/lp/1831.pdf ; NYC DCP (2003), https://www.nyc.gov/assets/planning/download/pdf/plans/north-corona/northcorona.pdf"}},"n-Mvn9Bv":{"type":"image","data":{"caption":"CD 403: recorded retail-bearing tax lots and restaurants (left); residential units per tax lot and K–12 facilities (right). Sources: [7] PLUTO, [1] DOHMH restaurant records, [13] NYC Facilities Database.\nProduced with AI-assisted Python analysis and plotting.","image":"r-xMpUJB"},"config":{"size":"full"}},"n-WPY0Ze":{"type":"text","data":{"type":"paragraph","text":"Restaurants concentrate along streets that also contain a substantial share of the district’s retail-bearing properties. The three avenues account for 53.4% of retail-bearing tax lots and 60.6% of restaurant establishments. This suggests that food businesses operate within an established commercial framework. Together with the historical planning evidence, the pattern supports planning and available shop space as part of the explanation, while leaving room for customer demand and business clustering."}},"n-UyXbYp":{"type":"text","data":{"type":"paragraph","text":"The right-hand map places restaurants’ commercial setting alongside residential properties and K–12 facilities across the district. Larger circles indicate more housing units on a tax lot. Housing extends beyond the main food corridors, while schools create additional destinations within residential areas. These layers identify potential everyday connections between homes, schools and food streets."}},"n-QABJdj":{"type":"text","data":{"type":"paragraph","text":"Source: NYC PLUTO 26v2, https://data.cityofnewyork.us/d/64uk-42ks"}},"n-IOKGXX":{"type":"text","data":{"type":"h4","text":"Different Corridors, Different Food Geographies"}},"n-QeZtfb":{"type":"text","data":{"type":"paragraph","text":"The district contains several kinds of food corridor. Roosevelt Avenue follows the subway; 37th Avenue combines a broad cuisine mix with nearby residential blocks; Northern Boulevard supports an equally large restaurant count farther from the trains. Junction Boulevard adds 32 establishments and Astoria Boulevard 19. The chart below includes these corridors and all remaining streets, extending the comparison beyond the Jackson Heights core."}},"n-nq81TP":{"type":"text","data":{"text":"Roosevelt Avenue","type":"h3"},"config":{"size":"wide"}},"n-1FH4xa":{"type":"text","data":{"text":"Roosevelt Avenue contains 80 establishments and 19 recorded cuisine categories. Latin American, Spanish, Mexican and Tex-Mex labels together account for 54 records (67.5%). All 80 establishments fall within the modelled five-minute walk to a subway entrance.","type":"paragraph"},"config":{"size":"wide"}},"n-mOT8QV":{"type":"text","data":{"text":"Photo: Roosevelt Avenue beneath the 7 train, 2005. Jleon, CC BY 2.5, via Wikimedia Commons.","type":"paragraph"},"config":{"size":"wide"}},"n-PMRaaM":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-nq81TP","n-1FH4xa","n-mOT8QV"]},"n-MiopUP":{"type":"image","data":{"image":"r-oqd9Tv"}},"n-X8yNW9":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-PMRaaM","n-MiopUP"]},"n-0hmGY6":{"type":"text","data":{"text":"37th Avenue","type":"h3"},"config":{"size":"wide"}},"n-ervOlA":{"type":"text","data":{"text":"37th Avenue contains 112 establishments and 24 recorded cuisine categories. Its mix includes Latin American and Spanish cuisines, Mexican and Tex-Mex food, South Asian cuisines, and East and Southeast Asian offerings. Sixty-seven establishments fall within five minutes of a subway entrance, and all 112 within ten.","type":"paragraph"},"config":{"size":"wide"}},"n-wiujxJ":{"type":"text","data":{"text":"Photo: 74th Street at 37th Avenue, 2018. Jim.henderson, CC BY-SA 4.0, via Wikimedia Commons.","type":"paragraph"},"config":{"size":"wide"}},"n-IMosGr":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-0hmGY6","n-ervOlA","n-wiujxJ"]},"n-p5KxBK":{"type":"image","data":{"image":"r-SY54ty"}},"n-VfFsak":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-IMosGr","n-p5KxBK"]},"n-QbJrfB":{"type":"text","data":{"text":"Northern Boulevard","type":"h3"},"config":{"size":"wide"}},"n-3MDC79":{"type":"text","data":{"text":"Northern Boulevard contains 112 establishments and 24 recorded cuisine categories, matching 37th Avenue in both measures. Yet none lies within a modelled five-minute subway walk and only four within ten minutes. Its food concentration shows that proximity to the subway is only one part of the district’s commercial geography.","type":"paragraph"},"config":{"size":"wide"}},"n-YBnyjC":{"type":"text","data":{"text":"Photo: Northern Boulevard at Broadway. Caitlin Regan, CC BY 2.0, via Wikimedia Commons.","type":"paragraph"},"config":{"size":"wide"}},"n-aoaznl":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-QbJrfB","n-3MDC79","n-YBnyjC"]},"n-h9vOgs":{"type":"image","data":{"image":"r-Qch966"}},"n-bxS43C":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-aoaznl","n-h9vOgs"]},"n-qkfvK8":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-X8yNW9","n-VfFsak","n-bxS43C"]},"n-WRkqPH":{"type":"image","data":{"caption":"Cuisine composition across five named address corridors and all remaining streets in CD 403. \nProduced with AI-assisted Python analysis and plotting.","image":"r-vB0P6l"},"config":{"size":"wide"}},"n-k25Yic":{"type":"text","data":{"type":"paragraph","text":"Restaurants were grouped by the street recorded in their address: 37th Avenue, Roosevelt Avenue, Northern Boulevard, Junction Boulevard, Astoria Boulevard, or all remaining streets. Recorded cuisine labels were combined into six display groups, and establishments in each group were counted for every corridor. Each group’s count was divided by the corridor’s total to calculate its percentage"}},"n-NZWKsY":{"type":"text","data":{"type":"h4","text":"Reading the Evidence Together"}},"n-QLXcf1":{"type":"text","data":{"type":"paragraph","text":"Read together, the evidence suggests a layered explanation: planning and buildings shape where shops can operate; housing and accessibility provide potential demand; businesses and community networks may shape what those shops become. The maps reveal spatial relationships rather than establish causes. Further investigation could examine commercial rents, business opening histories, interviews with business owners and residents, and observations of customer activity to test these explanations."}},"n-F7SuRy":{"type":"text","data":{"type":"h3","text":"02 · What Holds the Table Together?"}},"n-4LROHp":{"type":"text","data":{"type":"paragraph","text":"Transit access explains part of the food geography across the whole district, but not all of it. Of 502 restaurant records [1] in Community District 3 [4], 235 (47%) are within a modelled five-minute walk of a subway entrance [5] and 320 (64%) within ten. All 80 Roosevelt Avenue records lie within five minutes, and all 112 on 37th Avenue within ten. Northern Boulevard supports 112 records with none within five minutes and only four within ten; Astoria Boulevard adds 19 more, all beyond ten minutes.\n\nThe wider study area adds a third case. East Elmhurst [3], north of Northern Boulevard, has 54 restaurants and not one within a ten-minute walk of the subway: its median walk is 20 minutes, against about 5 minutes in Jackson Heights and North Corona. A full food corridor can exist without the train."}},"n-v6E9cb":{"type":"text","data":{"type":"paragraph","text":"Accessibility also differs by cuisine label: 24 of 26 South Asian-classified records (92%) fall within ten minutes, compared with 137 of 214 Latin American, Mexican and Spanish records (64%).\n\nThe shaded bands follow reachable streets at 80 metres per minute from every entry-allowed subway entrance. They omit crossing delays, crowding, accessibility barriers and time inside stations. Eight duplicate permit records for the same storefront were removed; businesses that share one building share one point, sized by their number. Click a restaurant for its nearest station and estimated walking time."}},"n-SbmpTP":{"type":"webmap","data":{"map":"r-77567aad44874843b4639420687ac801","caption":"CD 403 · Walking reach from the subway and restaurants. Sources: [1] DOHMH restaurant records, [4] community district boundary, [5] MTA subway entrances, [6] NYC Street Centerline; walking times computed by the authors (method below).","isShowingLegend":true,"legendPinned":true,"timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":-8229205.658896223,"ymin":4973397.909306923,"xmax":-8219153.226007324,"ymax":4979053.672053505},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":-8224179.442451773,"y":4976225.790680214},"zoom":13.93727185968765,"viewpoint":{"rotation":0,"scale":38377.14257803302,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":-8224179.442451773,"y":4976225.790680214}}}},"n-kF3Br4":{"type":"image","data":{"image":"r-Ynuj3J","caption":"Restaurant records by walking time to the nearest subway entrance, by recorded address corridor, CD 403. \nProduced with AI-assisted Python analysis and plotting."},"config":{"size":"standard"}},"n-MwD1dO":{"type":"text","data":{"type":"paragraph","text":"Walking times were estimated using a constant speed of 80 metres per minute, equivalent to 400 metres in five minutes and 800 metres in ten minutes. Walkable segments from NYC Street Centerline [6] formed the network. Restaurant locations [1] and entry-allowed subway entrances [5] were connected to their nearest street segments, including the connecting distances. A multi-source Dijkstra algorithm calculated the shortest network distance to a subway entrance, which was divided by 80 to estimate walking time."}},"n-Oyy8ra":{"type":"text","data":{"type":"paragraph","text":"\u003cspan\u003eFor the chart, restaurants were grouped by their recorded address street and classified as within five minutes, five to ten minutes, or beyond ten minutes. Each category’s count was divided by the total number of restaurants on that corridor to calculate its percentage.\u003c/span\u003e"}},"n-0woEXR":{"type":"text","data":{"type":"paragraph","text":"\u003cspan\u003eFor the map, subway entrances served as origins. Street sections reachable within 400 and 800 metres were identified and given a 35-metre buffer on each side to make them visible. The lighter band shows the additional reach between five and ten minutes.\u003c/span\u003e"}},"n-bCGX8Q":{"type":"text","data":{"type":"h3","text":"03 · From Map to Menu"}},"n-gsiqa8":{"type":"text","data":{"type":"paragraph","text":"The district-wide maps show where food businesses concentrate and how subway access varies. The following stops offer a closer look at Jackson Heights, one part of CD 403, through dishes, small businesses and a meal we shared with friends. These selected examples add a personal perspective to the wider spatial analysis."}},"n-KNTWHE":{"type":"image","data":{"image":"r-aC4eli"}},"n-KPUrKg":{"type":"carousel","children":["n-KNTWHE"]},"n-GKryJI":{"type":"text","data":{"text":"Momo · Nepali Momo Cafe","type":"h3"},"config":{"size":"wide"}},"n-BdfVrz":{"type":"text","data":{"text":"74-18 37th Road. Steamed momo or jhol momo in broth, a few steps from the 74th Street station. Home turf of the annual Momo Crawl between restaurants and Diversity Plaza.","type":"paragraph"},"config":{"size":"wide"}},"n-RkOzzh":{"type":"image","data":{"image":"r-JaEWG6"}},"n-6kQ5tR":{"type":"carousel","children":["n-RkOzzh"]},"n-MPNoXZ":{"type":"text","data":{"text":"Arepa · Arepa Lady","type":"h3"},"config":{"size":"wide"}},"n-HNLaWv":{"type":"text","data":{"text":"77-17 37th Avenue. Arepa de choclo, a sweet corn cake with cheese. Founder María Piedad Cano went from a Roosevelt Avenue cart to a family restaurant that helps make this stretch a destination.","type":"paragraph"},"config":{"size":"wide"}},"n-jTSW9D":{"type":"image","data":{"image":"r-N6IkzT"}},"n-N5BNJz":{"type":"carousel","children":["n-jTSW9D"]},"n-LPh31b":{"type":"text","data":{"text":"Fuchka · Tong cart","type":"h3"},"config":{"size":"wide"}},"n-vNnfeS":{"type":"text","data":{"text":"Around 73rd Street and 37th Avenue; check the cart\u0026apos;s current spot. Crisp shells, potato and pulse filling, tamarind water. A queue, a quick exchange, a pause on the sidewalk: the smallest scale of public life, and one the restaurant register never records.","type":"paragraph"},"config":{"size":"wide"}},"n-XMw3jq":{"type":"image","data":{"image":"r-Rjmwj4"}},"n-RQCCI5":{"type":"carousel","children":["n-XMw3jq"]},"n-0l9gr0":{"type":"text","data":{"text":"Our table · Mojitos Restaurant Bar","type":"h3"},"config":{"size":"wide"}},"n-mAO6Uh":{"type":"text","data":{"text":"81-01 Northern Boulevard. Our stop with friends, on a food corridor extending beyond the modelled ten-minute subway reach. The field video below brings this mapped location back to the scale of a shared table.","type":"paragraph"},"config":{"size":"wide"}},"n-8F92ci":{"type":"tour-map","data":{"geometries":{"99cb446d-05a2-4b11-b75e-af371663e3a0":{"id":"99cb446d-05a2-4b11-b75e-af371663e3a0","type":"POINT_NUMBERED_TOUR","nodes":[{"long":-73.89112534648278,"lat":40.74738677926502}]},"5561af0f-23b8-485b-a146-00c005e67e7c":{"id":"5561af0f-23b8-485b-a146-00c005e67e7c","type":"POINT_NUMBERED_TOUR","nodes":[{"long":-73.88852779468876,"lat":40.749658589801506}]}}}},"n-BKJjSm":{"type":"tour","data":{"type":"guided-tour","subtype":"map-focused","narrativePanelPosition":"start","places":[{"id":"n-ySO2kK","featureId":"","contents":["n-BdfVrz"],"media":"n-KPUrKg","title":"n-GKryJI"},{"id":"n-WfFjDS","featureId":"99cb446d-05a2-4b11-b75e-af371663e3a0","contents":["n-HNLaWv"],"media":"n-6kQ5tR","title":"n-MPNoXZ"},{"id":"n-V9CzM4","featureId":"5561af0f-23b8-485b-a146-00c005e67e7c","contents":["n-vNnfeS"],"media":"n-N5BNJz","title":"n-LPh31b"},{"id":"n-5Xipi0","featureId":"","contents":["n-mAO6Uh"],"media":"n-RQCCI5","title":"n-0l9gr0"}],"narrativePanelSize":"small","map":"n-8F92ci"}},"n-xzeneE":{"type":"text","data":{"type":"h4","text":"Mojitos · Our table on Northern Boulevard"}},"n-ds7DqY":{"type":"text","data":{"type":"paragraph","text":"We visited Mojitos Restaurant Bar with friends at 81-01 Northern Boulevard. Its published menu brings arepitas con hogao, empanadas and bandeja paisa together with dishes such as chaufa and quesadillas. The range illustrates how one restaurant can offer more variety than a single administrative cuisine label captures.Source: https://mojitosrestaurantbar.toast.site/order"}},"n-tHXq6E":{"type":"text","data":{"type":"h4","text":"A seat at our table · Field video"}},"n-ibkq8l":{"type":"video","data":{"video":"r-FhlL8Q","thumbnail":"r-gwGZfl"}},"n-t5U075":{"type":"text","data":{"type":"paragraph","text":"Our visit connects the district-wide analysis with an everyday experience: choosing a place, travelling there and sharing a meal. It offers one personal view of Northern Boulevard’s food culture."}},"n-CpKMip":{"type":"text","data":{"type":"paragraph","text":"A World at the Table connects food, culture and everyday public life across Community District 3. Jackson Heights, East Elmhurst and North Corona share a network of food streets, residential blocks and local destinations. Restaurants bring people to commercial corridors, while places such as Diversity Plaza, neighborhood parks and the 34th Avenue Open Street offer room to sit, meet and spend time beyond a meal. Supporting those connections means supporting walkable streets, welcoming public spaces and the small businesses that give the district its character."}},"n-cIKydJ":{"type":"text","data":{"type":"h3","text":"Data Sources · Soft Systems"}},"n-Hqr2FO":{"type":"text","data":{"type":"paragraph","text":"[1] NYC DOHMH restaurant inspection records (snapshot downloaded 3 Nov 2026): https://data.cityofnewyork.us/d/43nn-pn8j\n[2] NYC DCP Census 2020 tables: https://www.nyc.gov/assets/planning/download/office/planning-level/nyc-population/census2020/nyc_decennialcensusdata_2010_2020_change.xlsx\n[3] NTA boundaries (2020): https://data.cityofnewyork.us/d/9nt8-h7nd\n[4] Community district boundaries (BoroCD 403): https://data.cityofnewyork.us/d/5crt-au7u\n[5] MTA subway entrances: https://data.ny.gov/d/i9wp-a4ja\n[6] NYC Street Centerline: https://data.cityofnewyork.us/d/inkn-q76z\n[7] PLUTO: https://data.cityofnewyork.us/d/64uk-42ks\n[8] Pedestrian plazas: https://data.cityofnewyork.us/d/k5k6-6jex\n[9] Parks: https://data.cityofnewyork.us/d/enfh-gkve\n[10] Open Streets: https://data.cityofnewyork.us/d/uiay-nctu\n[11] Diversity Plaza context: https://www.nyc.gov/site/cecm/permitting/diversity-plaza.page\n[12] 34th Avenue context: https://www.nyc.gov/html/dot/html/about/34ave.shtml\n\nAdditional land-use research\n[13] NYC Facilities Database (K–12 schools): https://data.cityofnewyork.us/d/ji82-xba5\n[14] LPC, Jackson Heights Historic District designation report (1993): https://s-media.nyc.gov/agencies/lpc/lp/1831.pdf\n[15] DCP, North Corona rezoning (2003; eastern context only): https://www.nyc.gov/assets/planning/download/pdf/plans/north-corona/northcorona.pdf\n[16] SBS / Chhaya, Jackson Heights Commercial District Needs Assessment: https://chhayacdc.org/wp-content/uploads/2019/11/avenyc-cdna-jackson-heights.pdf"}},"n-wk7LPa":{"type":"text","data":{"type":"h2","text":"Shaping Jackson Heights"}},"n-8cRGIt":{"type":"text","data":{"type":"paragraph","text":"\u0026quot;The city shapes the community. The community reshapes the city.\u0026quot; "}},"n-2zB3QN":{"type":"text","data":{"type":"paragraph","text":"In 1909, the Queensboro Corporation imposed a Garden City ideal onto a rigid grid, engineering generous open space into every block. Over the following century, that engineered generosity was steadily enclosed, first by private co-ops and later by mounting population pressure, until the neighborhood with the least park space per resident in New York City had to invent its own: a street. Paseo Park is not a planner\u0026apos;s amenity handed down from above; it is what residents built when the system stopped providing. Planned for a community. Reshaped by the people."}},"n-aDBTZe":{"type":"text","data":{"type":"h3","text":"When One System Becomes the Other"}},"n-7x9vN6":{"type":"text","data":{"type":"paragraph","text":"Three phases in this storymap show the two systems trading places rather than merely coming into contact."}},"n-6BFg7M":{"type":"text","data":{"type":"numbered-list","text":"\u003cli\u003e\u003cstrong\u003ePaseo Park.\u003c/strong\u003e Street width — a hard-system asset — now functions as the neighborhood\u0026apos;s largest open space, without being mapped as parkland and without a single change to the underlying geometry. The asphalt did not move; its assignment did.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eThe interior block gardens.\u003c/strong\u003e Technically private open space, each is reachable only through a driveway cut into the street wall. The street system decides who enters the open-space system.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eThe bioswales.\u003c/strong\u003e They sit inside the street right-of-way but do a park\u0026apos;s work: absorbing stormwater, carrying tree canopy. Parkland function, street-system land.\u003c/li\u003e"}},"n-PtsTxF":{"type":"text","data":{"type":"paragraph","text":"The boundary the Garden City planners drew in 1909 has proven porous. Jackson Heights keeps resolving a shortage in one system by quietly converting capacity from the other."}},"n-JWBnoK":{"type":"text","data":{"type":"paragraph","text":"Read together, the street, open-space, and food maps reveal a shared urban system. Transit helps concentrate restaurants along southern corridors, while Northern Boulevard shows that food destinations also persist beyond the modelled subway walkshed. Open streets and plazas provide places where movement can become lingering and encounter. These physical conditions support everyday social life, but do not explain it alone: businesses, cultural practices, and community stewardship give those spaces meaning."}},"n-TUOyWz":{"type":"text","data":{"type":"paragraph","text":"Data \u0026amp; Sources:\n1. The New York Times (diversity reporting)\n2. NYC Parks Department / Trust for Public Land (tpl.org) - park access ranking\n3. NYC DOT \u0026amp; Grist (grist.org) - 34th Avenue Open Street / Paseo Park\n4. NYC Landmarks Preservation Commission, Jackson Heights Historic District Designation Report (nyc.gov)\n5. Historic Districts Council (6tocelebrate.org)\n6. City Lore (citylore.org)\n7. NYC Open Data - Building Footprints (NYC OTI/DoITT), Street Centerline/CSCL (NYC OTI)\n8. NYC Parks Properties (NYC Parks Department)\n9. Jackson Heights Beautification Group, The Green Agenda (jhbg.org)\n10. NYC Dept. of City Planning / Queens Community Board 3, ULURP needs assessment (queenscb3.cityofnewyork.us)\n11. OpenStreetMap via Geofabrik (land use, railway/subway lines, subway stations)\n12. Foursquare Open Source Places (Oct 2024 snapshot, schools)\n13. NYC DOT/OTI - Street Centerline/CSCL bike_lane field\n14. NYC DEP - Municipal Separate Storm Sewer System (MS4) green infrastructure assets\n15. MTA / NYC OpenData - NYC Subway Stations\n16. NYC 2020 Neighborhood Tabulation Areas (NTA) - neighborhood boundary\n17. NYC Planning Population FactFinder - 2020 Census population data"}},"n-8mIixQ":{"type":"text","data":{"text":"","type":"h2"}},"n-RYT2E5":{"type":"text","data":{"text":"","type":"paragraph"}},"n-4TaYGl":{"type":"attribution","data":{"content":"","attribution":""}},"n-9hiTuc":{"type":"credits","config":{"isHidden":true},"children":["n-8mIixQ","n-RYT2E5","n-4TaYGl"]},"n-7Qjj5e":{"type":"story","data":{"storyTheme":"r-Cx392T"},"config":{"coverDate":"first-published","isSocialIconsHidden":false,"shouldHideSimilarItems":true,"scriptEmbedDomains":["yl4389"],"isScriptEmbedEnabled":true,"storyLocale":"zh-cn"},"children":["n-7mE6PZ","n-speiLj","n-DbdsXO","n-CYhTLf","n-b1N9T5","n-TLJlM0","n-VwIX0Q","n-3FmSC3","n-i0u96G","n-LOA84D","n-VX0oZ1","n-zFgZjX","n-nbw7Wp","n-896q4E","n-pp16Gp","n-F4sYRa","n-HHaA7A","n-3pz6eQ","n-ndaCR4","n-EC0Hz8","n-HYDFba","n-KJbjZJ","n-u5yMff","n-oNwOsO","n-LQ1vnA","n-tTwV9W","n-l4eSmq","n-iUSB1Y","n-BEY6LP","n-BhB4SN","n-Ek8Wfz","n-we6YuT","n-uJVQA4","n-pEwaKl","n-Ewd6da","n-sA91fm","n-rvW7E2","n-zDNlN0","n-Ask8YR","n-1icgoA","n-tkLDqo","n-sUyYKY","n-MPjl6N","n-nE8lG4","n-su5a6V","n-U6UY2L","n-iErLYp","n-rEO90g","n-X8ssvG","n-FVYgfj","n or-themeColor1\"\u003e强调颜色 1\u003c/span\u003e、\u003cspan class=\"sm-text-color-themeColor2\"\u003e强调颜色 2\u003c/span\u003e 和\u003cspan class=\"sm-text-color-themeColor3\"\u003e强调颜色 3\u003c/span\u003e 格式化的文本以及主题中的\u003ca href=\"#link-style\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e链接样式\u003c/a\u003e。","component.themePreviewSampleCollection.item.title":"项目标题","component.themePreviewSampleCollection.item.exampleTitle1":"示例项目 1","component.themePreviewSampleCollection.item.exampleTitle2":"示例项目 2","component.themePreviewSampleCollection.item.label1":"加利福尼亚州雷德兰兹","component.themePreviewSampleCollection.item.label2":"加拿大多伦多","component.themePreviewSampleCollection.item.locationLabel":"如果您为项目设置了位置，它可以在集合概览地图中显示","component.themePreviewSampleStory.navigation.credits":"制作者名单","component.themePreviewSampleStory.bodyText1":"此故事包含您可能在自己的故事中使用的一些片段，例如段落、按钮、分隔符等。 首先，请展开部分样式面板并进行一些调整。 当您进行更改时，您将看到此故事演示其外观。 例如，尝试更改背景颜色，然后观察故事与导航栏（上方）如何变化。","component.themePreviewSampleStory.bodyText2":"接下来，尝试更改段落字体，然后查看此文本的变化。 然后，尝试调整引号样式与对齐方式，查看您的选择对下方引号的影响。 您还会看到，将引用段落字体作为其文本字体。","component.themePreviewSampleStory.bodyText3":"您可以设置段落文本的样式，以使用\u003cstrong\u003e粗体\u003c/strong\u003e、\u003cem\u003e斜体\u003c/em\u003e和\u003cem\u003e\u003cstrong\u003e粗斜体\u003c/strong\u003e\u003c/em\u003e，由此相应地强调重要文本。 您所选择的字体已预装在内，因此您无需进行任何配置。","component.themePreviewSampleStory.bodyText4":"如果您在故事中添加了精简地图或地图游览，则要素最初使用\u003cspan class=\"sm-text-color-themeColor1\"\u003e强调颜色\u003c/span\u003e(但是，您可以使用其他强调颜色或您喜欢的任何颜色设置其样式)。","component.themePreviewSampleStory.bodyText5":"数据系列使用主题强调色和段落字体表示。 图表和坐标轴标题使用标题字体。","component.themePreviewSampleStory.bodyText7":"主题的辅助背景颜色用于内容元素，包括表格标题行和制作者名单部分（下方）。 表格使用段落颜色和字体，标题行使用粗体段落样式。","component.themePreviewSampleStory.bodyText8":"您可以选择多种不同的分隔符样式选项；在这些选项之间进行切换，查看以下分隔符在切换时如何变化。 分隔符、引号、按钮和链接均使用主题的\u003cspan class=\"sm-text-color-themeColor1\"\u003e强调颜色\u003c/span\u003e(除非手动覆盖)。","component.themePreviewSampleStory.bodyText9":"想知道嵌入式卡片是什么样的吗? 请查看以下示例!","component.themePreviewSampleStory.s onent.myContent.allContent":"所有内容","component.myContent.allStatuses":"所有状态","component.myContent.viewItemsIn":"在以下位置查看项目","component.myContent.contentType":"内容类型","component.myContent.publishStatus":"发布状态","component.myContent.filters":"过滤器","component.myContent.allSharing":"所有共享","component.myContent.sort":"排序","common.createDropdown.onboarding.modal.p1.title":"什么是 ArcGIS StoryMaps?","common.createDropdown.onboarding.modal.p1.content.first":"ArcGIS StoryMaps 是下一代多媒体故事讲述工具，支持将地图和应用程序与各种媒体相结合来讲述故事。 它提供四种专为不同用途打造的内容格式：故事、简报、框架和集合。 此外，主题和模板还可以捕获设计和故事讲述模式，以帮助您快速创建全新的高质量内容。","common.createDropdown.onboarding.modal.p1.content.second":"单击浏览该简短教程，了解可以使用 ArcGIS StoryMaps 创建的每种项目类型。","common.createDropdown.onboarding.modal.p1.content.third":"在 \u003clink\u003eArcGIS StoryMaps 库\u003c/link\u003e中浏览所有内容类型的示例","common.createDropdown.onboarding.modal.p2.content.first":"故事是外观和行为与文章或博客相似的叙述内容。 它们可以具有沉浸式部分，即以媒体为中心的交互式查看体验。 可以在沉浸式部分中精心设计地图和媒体的移动，以为读者打造引人入胜的体验。","common.createDropdown.onboarding.modal.p2.content.second":"所有类型的 StoryMaps 使用直观的构建器打造，方便从 web 整合媒体、地图、应用程序和内容。 甚至可以直接在构建器中创建简单地图以突出显示相关位置。","common.createDropdown.onboarding.modal.p3.content.first":"简报是基于幻灯片的格式，专门用于提供实时演示文稿和简洁信息共享。 可使用灵活的内容块构建简报幻灯片以添加地图、应用程序和媒体。","common.createDropdown.onboarding.modal.p3.content.second":"可将简报共享为 Web 链接或通过 ArcGIS StoryMaps Briefings 应用程序进行查看。 Briefings app 尤其适用于管理人员和外业工作人员，他们需要在没有可靠网络连接时离线访问简报。","common.createDropdown.onboarding.modal.p4.content":"框架是移动优先的输出，适用于短篇故事讲述和信息共享。 框架的常见用途包括推广预告片、活动公告或者掌上数字游览。 它们适用于在手机上查看以及在社交媒体平台上共享以供更多人访问。","common.createDropdown.onboarding.modal.p5.content.first":"集合是一系列采用产品组合式查看体验汇编的相关内容。 可以将故事、简报和框架添加至集合并包括应用程序、PDF 和媒体等支持内容。 集合还可以在地图上呈现项目，以进行地理探索。","common.createDropdown.onboarding.modal.p5.content.second":"可以使用集合围绕主题对故事进行分组或者将内容与特定受众共享。 在会议中或在大堂显示屏上自动播放集合，以吸引参与者或展示组织工作。","common.createDropdown.onboarding.modal.p6.content.first":"主题用于捕获内容观感。 可定义按钮、引语和部分分隔符等元素的颜色、字体和样式。 在构建自定义主题后，可以将其应用于已使用 ArcGIS StoryMaps 创建的任何内容。","common.createDropdown.onboarding.modal.p6.content.second":"如果您要寻找灵感，AI 助手可以根据描述或图像生成建议的新主题起点，或者只需从一系列即用型专业设计主题中进行选择即可。","common.createDropdown.onboarding.modal.p7.content.first":"模板是一种特殊的故事，可供他人复制和用作构建基础。 它们可以用作定期报表、课堂任务或关于不同地点的相似故事集的起点。","common.createDropdown.onboarding.modal.p7.content.second":"模板构建器与故事构建器相同，此外还包含指令块，用于向基于该模板进行构建的所有人提供指示。 您可以从头开始构建模板，也可以为已制作的故事创建模板版本。","common.createDropdown.onboarding.modal.p8.title":"了解详细信息并获取灵感","common.createDropdown.onboarding.modal.p8.content.first":"请访问 \u003clink\u003eArcGIS StoryMaps 博客\u003c/link\u003e了解故事讲述的基础知识以及可使您的内容更加有效和引人入胜的提示。","common.createDropdown.onboarding.modal.p8.content.second":"同时一定要浏览 \u003clink\u003eArcGIS StoryMaps 库\u003c/link\u003e。 这是一个获取灵感的好地方，这里有由充满活力、多元共生的故事讲述社区创建的故事、简报、框架、集合、模板和主题的诸多典型示例。","common.banner.storyMapperContest.shortTitle":"参加 2026 年度 ArcGIS StoryMaps 大赛","common.banner.storyMapperContest.description":"展示地图如何让您的社区变得更好。 请在 12 月 11 日之前提交您的故事。","component.socialSharing.linkSuccess":"成功","component.storyCreator.creating":"正在启动故事构建器","component.briefingCreator.creating":"正在启动简报构建器","component.storyEditor.saveErrorTitle":"抱歉！","component.storyEditor.saveErrorDetails":"保存您的故事时出现问题","component.themeCreator.launchingThemeBuilder":"正在启动主题构建器","component.theme.confirmDelete.alt":"是否确定要删除此主题? 无法撤消此操作。","component.themes.empty.noThemesTitle":"创建您的第一个主题","component.themes.empty.noThemesDesc":"捕获一系列字体、颜色和样式以重用和与他人共享","component.themes.empty.noFavesTitle":"您收藏的主题将在此处显示","component.themes.empty.noFavesDesc":"您收藏的所有主题都将保存在这里，可进行快速轻松访问","component.themes.index.searchLabel":"搜索主题","component.themes.themes":"主题","component.themes.themes.beta":"主题(测试版)","component.themes.itemCard.title":"主题(无标题)","component.themes.myThemes":"我的主题","component.themes.confirmDelete.button":"删除主题并应用 {defaultTheme}","component.themes.deleteModal.theme":"是否删除主题?","component.themes.confirmDelete":"如果删除此主题，则以下所列项目将自动采用 {defaultTheme} 主题","component.themes.confirmDelete.publishedCount":"已发布项目 {publishedCount}","component.themes.confirmDelete.draftCount":"草稿项目 {publishedCoun plines where maps and spatial analysis are an important component of their work.  One purpose of this website is to not only allow timely sharing of results with colleagues in one's group but the rapid dissemination to others across and outside of the Cornell community.\u003cdiv\u003e\u003cbr /\u003e\u003c/div\u003e\u003cdiv\u003eLocation information and spatial patterns often provide insights that evolved from researcher/educator's work and should be shared with peer researchers, policy makers and students.  A well designed map can, for example, reveal geographic patterns about the built environment, demographic structures as well as social and economic conditions both currently and with historical trends. \u003c/div\u003e\u003cdiv\u003e\u003cbr /\u003e\u003c/div\u003e\u003cdiv\u003eMembership is of two types--individual or group.  Several individuals who below to a given research group or class are generally assigned to that group.  For example, organizational site is being used by entire classes. Hence, m\u003cspan style=\"font-size:12.8000001907349px;\"\u003eembership in this \u0026quot;general purpose\u0026quot; ArcGIS Organization is large.\u003c/span\u003e\u003cspan style=\"font-size:12.8000001907349px;\"\u003e \u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr /\u003e\u003c/div\u003e\u003cdiv\u003eThe gallery on the home page of this site has recently been changed because of this increased membership.  Consequently, rather than displaying a rambling, confusing, overloaded gallery of every maps created by every member with publisher privileges, we have created a gallery for each group and representation of the \u003cspan style=\"font-size:12.8000001907349px;\"\u003emaps\u003c/span\u003e\u003cspan style=\"font-size:12.8000001907349px;\"\u003e for\u003c/span\u003e\u003cspan style=\"font-size:12.8000001907349px;\"\u003e that group is via a single icon in the Gallery on the home page. \u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cbr /
